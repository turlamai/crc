name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel only obsolete PR runs; never cancel required checks on main.
  # Each main push has a distinct run ID even when several commits arrive quickly.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket
        uses: Bogdanp/setup-racket@v1.12
        with:
          version: 'stable'
      - name: Reject checked-in generated Scribble output
        shell: bash
        run: |
          if git ls-files -- 'crc/doc/**' | grep -q .; then
            echo "::error::Generated documentation under crc/doc/ must not be committed."
            exit 1
          fi
      - name: Install package
        run: raco pkg install --auto --link "$(pwd)"
      - name: Run tests
        run: raco test -p crc
      - name: Run documented quickstart
        run: racket examples/quickstart.rkt
      - name: Build Scribble manual and verify package dependencies
        run: raco setup --check-pkg-deps -l crc
